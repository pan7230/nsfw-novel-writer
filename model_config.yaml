# NSFW Novel Writer - Model Configuration
# 当前使用的模型配置

current_model: "UnfilteredAI/NSFW-3B"

# 可选模型列表
available_models:
  - name: "UnfilteredAI/NSFW-3B"
    size_gb: 3
    recommended_ram_gb: 8
    description: "UnfilteredAI NSFW-3B - High quality NSFW novel generation, recommended for deep creative writing"
    hf_url: "https://hf-mirror.com/UnfilteredAI/NSFW-3B"
    github_url: "https://github.com/UnfilteredAI/NSFW-3B"
    
  - name: "OPT-125M"
    size_gb: 0.13
    recommended_ram_gb: 2
    description: "OPT-125M - Lightweight fast inference model, suitable for quick brainstorming"
    hf_url: "https://huggingface.co/facebook/opt-125m"
    github_url: "https://github.com/facebook/opt"

  - name: "custom_model_path"
    size_gb: null
    recommended_ram_gb: null
    description: "User-defined local model path"

# 推理参数（Transformers/Flask）
generation_params:
  max_new_tokens: 512
  temperature: 0.85
  top_p: 0.9
  repetition_penalty: 1.1

# llama.cpp 推理参数
llama_cpp_params:
  n_ctx: 2048           # Context window size
  n_batch: 512         # Batch size for sampling
  n_threads: 0         # Number of threads (0 = auto-detect)
  n_gpu_layers: -1     # GPU layers (-1 = all layers on GPU)

# vLLM 推理参数
vllm_params:
  max_model_len: 2048
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9

# NSFW 强度档位控制 (0-4)
nsfw_level: 3

# 当前创作模式
current_mode: "multi_perspective"  # 选项：first_person, multi_perspective

# 当前风格偏好
current_style: "subtle"  # 选项：subtle (细腻含蓄), direct (直白热烈)

# SANCTIS-Δ 架构层配置（可选）
sanctis_layers:
  enabled: true
  lux_sensory_detail: 0.7   # 感官细节强度 (0-1)
  crescen_pacing: "moderate" # pacing节奏：slow, moderate, fast
  kairos_emotional_logic: true  # 情感逻辑连贯性
  aegis_boundary_check: true   # 边界安全检查
  somnia_immersion_anchor: true # 沉浸感锚点
  ataraxia_drift_suppression: true # 漂移抑制

# 工作区文件路径
workspace_files:
  characters: ".workbuddy/nsfw-novel-writer/characters.md"
  world: ".workbuddy/nsfw-novel-writer/world.md"
  outline: ".workbuddy/nsfw-novel-writer/outline.md"
  blueprint: ".workbuddy/nsfw-novel-writer/blueprint.md"
  drafts_dir: ".workbuddy/nsfw-novel-writer/drafts/"
  reviews_dir: ".workbuddy/nsfw-novel-writer/reviews/"
  revised_dir: ".workbuddy/nsfw-novel-writer/revised/"

# 模型服务器配置
server:
  type: "transformers"  # transformers, llama.cpp, vllm
  host: "localhost"
  port: 5000

# GitHub 加速器配置（用于模型下载）
github_accelerator:
  enabled: true
  path: "../github-accelerator"
